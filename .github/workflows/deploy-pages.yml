name: Deploy playground to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify editor and build playground
        run: pnpm run verify
        env:
          VITE_USE_PACKAGED_EDITOR: true
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}

      - name: Verify package archives
        run: pnpm run verify:packages

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node --input-type=commonjs -e 'const { version } = require("./packages/vue/package.json"); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw Error(`Tag must match package version v${version}`)'

      - name: Install browser for regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify editor in Chromium
        run: pnpm run verify:integration-browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/vue-vite/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
